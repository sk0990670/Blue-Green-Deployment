name: CI/CD - Blue Green Java

on:
  workflow_dispatch:
    inputs:

      DEPLOY_ENV:
        description: "Choose which environment to deploy"
        required: true
        type: choice
        options:
          - blue
          - green

      DOCKER_TAG:
        description: "Choose the Docker image tag"
        required: true
        type: choice
        options:
          - blue
          - green

      SWITCH_TRAFFIC:
        description: "Switch traffic between Blue and Green"
        required: true
        type: boolean
        default: false


env:
  # Docker Hub repository MUST be lowercase
  IMAGE_NAME: solosahej/bluegreenjava

  TAG: ${{ inputs.DOCKER_TAG }}

  KUBE_NAMESPACE: webapps

  DEPLOY_ENV: ${{ inputs.DEPLOY_ENV }}

  # Kubernetes authentication
  K8S_API_SERVER: ${{ secrets.K8S_API_SERVER }}
  K8S_TOKEN: ${{ secrets.K8S_TOKEN }}


jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. Git Checkout
      # ==================================================

      - name: Git Checkout
        uses: actions/checkout@v7
        with:
          ref: main


      # ==================================================
      # 2. Setup Java 17
      # ==================================================

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven


      # ==================================================
      # 3. Check Maven
      # GitHub hosted runner already has Maven
      # ==================================================

      - name: Check Maven
        run: |
          java -version
          mvn -version


      # ==================================================
      # 4. Compile
      # EXACT Jenkins:
      # mvn compile
      # ==================================================

      - name: Compile
        run: |
          mvn -B compile


      # ==================================================
      # 5. Tests
      # EXACT Jenkins:
      # mvn test -DskipTests=true
      #
      # This intentionally skips test execution because
      # that is what your working Jenkins pipeline does.
      # ==================================================

      - name: Tests
        run: |
          mvn -B test -DskipTests=true


      # ==================================================
      # 6. Trivy Filesystem Scan
      #
      # IMPORTANT:
      # exit-code: 0 means vulnerabilities do not stop
      # the pipeline.
      # ==================================================

      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table


      # ==================================================
      # 7. Build Java Application
      # Nexus removed
      # ==================================================

      - name: Build
        run: |
          mvn -B package -DskipTests=true


      # ==================================================
      # 8. Docker Hub Login
      # ==================================================

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      # ==================================================
      # 9. Docker Build
      # ==================================================

      - name: Docker Build
        run: |
          echo "Building image:"
          echo "${IMAGE_NAME}:${TAG}"

          docker build \
            -t "${IMAGE_NAME}:${TAG}" \
            .


      # ==================================================
      # 10. Verify Docker Image
      # ==================================================

      - name: Verify Docker Image
        run: |
          docker image inspect "${IMAGE_NAME}:${TAG}" > /dev/null

          echo "Docker image created successfully:"
          echo "${IMAGE_NAME}:${TAG}"


      # ==================================================
      # 11. Trivy Image Scan
      #
      # IMPORTANT FIX:
      #
      # WRONG:
      # image-ref: ${IMAGE_NAME}:${TAG}
      #
      # CORRECT:
      # image-ref: ${{ env.IMAGE_NAME }}:${{ env.TAG }}
      #
      # This is the exact issue shown in your screenshot.
      # ==================================================

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ env.TAG }}"
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table


      # ==================================================
      # 12. Docker Push
      # ==================================================

      - name: Docker Push Image
        run: |
          docker push "${IMAGE_NAME}:${TAG}"


      # ==================================================
      # 13. Verify Kubernetes Credentials
      # ==================================================

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: latest


      # ==================================================
      # 14. Configure Kubernetes
      #
      # Same Jenkins concept:
      #
      # serverUrl     -> K8S_API_SERVER
      # credentialsId -> K8S_TOKEN
      # namespace     -> webapps
      # ==================================================

      - name: Configure Kubernetes
        run: |

          kubectl config set-cluster eks-cluster \
            --server="${K8S_API_SERVER}" \
            --insecure-skip-tls-verify=true

          kubectl config set-credentials k8-token \
            --token="${K8S_TOKEN}"

          kubectl config set-context eks-context \
            --cluster=eks-cluster \
            --user=k8-token \
            --namespace="${KUBE_NAMESPACE}"

          kubectl config use-context eks-context


      # ==================================================
      # 15. Kubernetes Permission Test
      # ==================================================

      - name: Test Kubernetes Connection
        run: |

          echo "Checking Pods permission..."
          test "$(kubectl auth can-i get pods -n "${KUBE_NAMESPACE}")" = "yes"

          echo "Checking Services permission..."
          test "$(kubectl auth can-i get services -n "${KUBE_NAMESPACE}")" = "yes"

          echo "Checking Deployments permission..."
          test "$(kubectl auth can-i get deployments -n "${KUBE_NAMESPACE}")" = "yes"

          echo "Checking Deployment create permission..."
          test "$(kubectl auth can-i create deployments -n "${KUBE_NAMESPACE}")" = "yes"

          echo "Checking Service patch permission..."
          test "$(kubectl auth can-i patch services -n "${KUBE_NAMESPACE}")" = "yes"

          echo "Checking Pod logs permission..."
          test "$(kubectl auth can-i get pods/log -n "${KUBE_NAMESPACE}")" = "yes"

          echo "All required Kubernetes permissions are available."


      # ==================================================
      # 16. Current Kubernetes Resources
      # ==================================================

      - name: Show Kubernetes Resources
        run: |

          echo "Current Pods:"
          kubectl get pods -n "${KUBE_NAMESPACE}"

          echo "Current Services:"
          kubectl get services -n "${KUBE_NAMESPACE}"

          echo "Current Deployments:"
          kubectl get deployments -n "${KUBE_NAMESPACE}"


      # ==================================================
      # 17. Deploy MySQL
      #
      # EXACT FILE:
      # mysql-ds.yml
      # ==================================================

      - name: Deploy MySQL Deployment and Service
        run: |

          kubectl apply \
            -f mysql-ds.yml \
            -n "${KUBE_NAMESPACE}"


      # ==================================================
      # 18. Wait for MySQL Service Endpoint
      #
      # This prevents application deployment from starting
      # before MySQL has a usable backend.
      # ==================================================

      - name: Verify MySQL Ready
        run: |

          echo "Waiting for MySQL endpoint..."

          for i in {1..30}; do

            MYSQL_ENDPOINTS=$(kubectl get endpoints mysql \
              -n "${KUBE_NAMESPACE}" \
              -o jsonpath='{.subsets[*].addresses[*].ip}' 2>/dev/null || true)

            if [ -n "${MYSQL_ENDPOINTS}" ]; then
              echo "MySQL endpoint is ready: ${MYSQL_ENDPOINTS}"
              exit 0
            fi

            echo "MySQL is not ready yet... attempt ${i}/30"
            sleep 5

          done

          echo "ERROR: MySQL did not become ready."
          kubectl get pods -n "${KUBE_NAMESPACE}"
          kubectl get svc mysql -n "${KUBE_NAMESPACE}"
          kubectl get endpoints mysql -n "${KUBE_NAMESPACE}"

          exit 1


      # ==================================================
      # 19. Deploy Application Service
      #
      # EXACT FILE:
      # bankapp-service.yml
      #
      # EXACT RESOURCE:
      # bankapp-service
      # ==================================================

      - name: Deploy SVC-APP
        run: |

          if ! kubectl get svc bankapp-service \
            -n "${KUBE_NAMESPACE}" > /dev/null 2>&1
          then

            echo "bankapp-service does not exist."
            echo "Creating bankapp-service..."

            kubectl apply \
              -f bankapp-service.yml \
              -n "${KUBE_NAMESPACE}"

          else

            echo "bankapp-service already exists."

          fi


      # ==================================================
      # 20. Select Blue / Green Deployment File
      # ==================================================

      - name: Select Deployment File
        run: |

          if [ "${DEPLOY_ENV}" = "blue" ]; then

            echo "DEPLOYMENT_FILE=app-deployment-blue.yml" \
              >> "${GITHUB_ENV}"

          else

            echo "DEPLOYMENT_FILE=app-deployment-green.yml" \
              >> "${GITHUB_ENV}"

          fi


      # ==================================================
      # 21. Deploy Blue / Green
      #
      # EXACT FILE NAMES FROM JENKINS
      # ==================================================

      - name: Deploy to Kubernetes
        run: |

          echo "Deploying ${DEPLOY_ENV} environment"
          echo "Using ${DEPLOYMENT_FILE}"

          kubectl apply \
            -f "${DEPLOYMENT_FILE}" \
            -n "${KUBE_NAMESPACE}"


      # ==================================================
      # 22. Find Actual Deployment
      #
      # We DO NOT assume deployment name is app-blue/app-green.
      # The actual deployment is discovered from the pod owner.
      # ==================================================

      - name: Detect Deployment
        run: |

          echo "Finding ${DEPLOY_ENV} deployment..."

          POD_NAME=$(kubectl get pods \
            -n "${KUBE_NAMESPACE}" \
            -l version="${DEPLOY_ENV}" \
            -o jsonpath='{.items[0].metadata.name}')

          if [ -z "${POD_NAME}" ]; then

            echo "ERROR: No pod found with version=${DEPLOY_ENV}"

            kubectl get pods \
              -n "${KUBE_NAMESPACE}" \
              --show-labels

            exit 1
          fi

          echo "Detected Pod: ${POD_NAME}"


          REPLICA_SET=$(kubectl get pod "${POD_NAME}" \
            -n "${KUBE_NAMESPACE}" \
            -o jsonpath='{.metadata.ownerReferences[0].name}')

          if [ -z "${REPLICA_SET}" ]; then

            echo "ERROR: Could not determine ReplicaSet."

            kubectl describe pod "${POD_NAME}" \
              -n "${KUBE_NAMESPACE}"

            exit 1
          fi

          echo "Detected ReplicaSet: ${REPLICA_SET}"


          DEPLOYMENT_NAME=$(kubectl get rs "${REPLICA_SET}" \
            -n "${KUBE_NAMESPACE}" \
            -o jsonpath='{.metadata.ownerReferences[0].name}')

          if [ -z "${DEPLOYMENT_NAME}" ]; then

            echo "ERROR: Could not determine Deployment."

            kubectl describe rs "${REPLICA_SET}" \
              -n "${KUBE_NAMESPACE}"

            exit 1
          fi

          echo "Detected Deployment: ${DEPLOYMENT_NAME}"

          echo "DEPLOYMENT_NAME=${DEPLOYMENT_NAME}" \
            >> "${GITHUB_ENV}"


      # ==================================================
      # 23. Wait for Rollout
      #
      # This avoids hard-coding app-blue/app-green.
      # ==================================================

      - name: Wait for Deployment
        run: |

          echo "Waiting for deployment:"
          echo "${DEPLOYMENT_NAME}"

          kubectl rollout status \
            deployment/"${DEPLOYMENT_NAME}" \
            -n "${KUBE_NAMESPACE}" \
            --timeout=180s


      # ==================================================
      # 24. Check Deployment Pods
      # ==================================================

      - name: Check Deployment Pods
        run: |

          kubectl get pods \
            -l version="${DEPLOY_ENV}" \
            -n "${KUBE_NAMESPACE}" \
            -o wide


      # ==================================================
      # 25. Verify Pods Are Ready
      #
      # Traffic will NOT switch unless the new environment
      # actually has Ready pods.
      # ==================================================

      - name: Verify Pods Are Ready
        run: |

          kubectl wait \
            --for=condition=ready \
            pod \
            -l version="${DEPLOY_ENV}" \
            -n "${KUBE_NAMESPACE}" \
            --timeout=120s


      # ==================================================
      # 26. Switch Traffic
      #
      # EXACT Jenkins logic
      # ==================================================

      - name: Switch Traffic
        if: ${{ inputs.SWITCH_TRAFFIC == true }}
        run: |

          echo "Switching traffic to ${DEPLOY_ENV}"

          kubectl patch service bankapp-service \
            -n "${KUBE_NAMESPACE}" \
            -p "{\"spec\":{\"selector\":{\"app\":\"bankapp\",\"version\":\"${DEPLOY_ENV}\"}}}"

          echo "Traffic successfully switched to ${DEPLOY_ENV}."


      # ==================================================
      # 27. Verify Deployment
      #
      # EXACT Jenkins verification resources
      # ==================================================

      - name: Verify Deployment
        run: |

          echo "======================================"
          echo "Pods"
          echo "======================================"

          kubectl get pods \
            -l version="${DEPLOY_ENV}" \
            -n "${KUBE_NAMESPACE}"


          echo "======================================"
          echo "Service"
          echo "======================================"

          kubectl get svc \
            bankapp-service \
            -n "${KUBE_NAMESPACE}"


          echo "======================================"
          echo "Service Endpoints"
          echo "======================================"

          kubectl get endpoints \
            bankapp-service \
            -n "${KUBE_NAMESPACE}"


          echo "======================================"
          echo "Deployment"
          echo "======================================"

          kubectl get deployment \
            "${DEPLOYMENT_NAME}" \
            -n "${KUBE_NAMESPACE}"


      # ==================================================
      # 28. Diagnostics on Kubernetes Failure
      #
      # Very useful for your ImagePullBackOff challenge.
      # It does NOT hide the original failure.
      # ==================================================

      - name: Kubernetes Diagnostics
        if: ${{ failure() }}
        run: |

          echo "========== PODS =========="
          kubectl get pods \
            -n "${KUBE_NAMESPACE}" \
            -o wide || true

          echo "========== EVENTS =========="
          kubectl get events \
            -n "${KUBE_NAMESPACE}" \
            --sort-by=.lastTimestamp || true

          echo "========== DEPLOYMENTS =========="
          kubectl get deployments \
            -n "${KUBE_NAMESPACE}" || true

          echo "========== SERVICES =========="
          kubectl get svc \
            -n "${KUBE_NAMESPACE}" || true


      # ==================================================
      # 29. Final Status
      # ==================================================

      - name: Deployment Successful
        run: |

          echo "======================================"
          echo "Deployment Successful"
          echo "Environment : ${DEPLOY_ENV}"
          echo "Docker Tag  : ${TAG}"
          echo "Image       : ${IMAGE_NAME}:${TAG}"
          echo "Deployment  : ${DEPLOYMENT_NAME}"
          echo "Namespace   : ${KUBE_NAMESPACE}"
          echo "======================================"
