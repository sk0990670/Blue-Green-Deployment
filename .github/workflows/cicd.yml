name: CI/CD - Blue Green Java

on:
  workflow_dispatch:
    inputs:

      DEPLOY_ENV:
        description: "Choose which environment to deploy"
        required: true
        type: choice
        options:
          - blue
          - green

      DOCKER_TAG:
        description: "Choose the Docker image tag"
        required: true
        type: choice
        options:
          - blue
          - green

      SWITCH_TRAFFIC:
        description: "Switch traffic between Blue and Green"
        required: true
        type: boolean
        default: false


env:
  IMAGE_NAME: solosahej/bluegreenjava
  TAG: ${{ inputs.DOCKER_TAG }}

  KUBE_NAMESPACE: webapps

  DEPLOY_ENV: ${{ inputs.DEPLOY_ENV }}

  DEPLOYMENT: app-${{ inputs.DEPLOY_ENV }}

  K8S_API_SERVER: ${{ secrets.K8S_API_SERVER }}
  K8S_TOKEN: ${{ secrets.K8S_TOKEN }}


jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. Git Checkout
      # Jenkins:
      # git branch: 'main'
      # ==================================================

      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          ref: main


      # ==================================================
      # 2. Setup Java 17
      # Jenkins:
      # tools { jdk 'java 17' }
      # ==================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven


      # ==================================================
      # 3. Install Maven
      # Jenkins:
      # tools { maven 'Maven 3.6' }
      # ==================================================

      - name: Setup Maven
        run: |
          sudo apt-get update
          sudo apt-get install -y maven
          mvn -version


      # ==================================================
      # 4. Compile
      # EXACT Jenkins:
      # mvn compile
      # ==================================================

      - name: Compile
        run: |
          mvn compile


      # ==================================================
      # 5. Tests
      # EXACT Jenkins:
      # mvn test -DskipTests=true
      #
      # This keeps the Tests stage but skips actual tests,
      # matching your working Jenkins pipeline.
      # ==================================================

      - name: Tests
        run: |
          mvn test -DskipTests=true


      # ==================================================
      # 6. Trivy FS Scan
      #
      # Jenkins:
      # trivy fs --format table -o fs.html .
      #
      # exit-code 0:
      # vulnerabilities won't stop CICD
      # ==================================================

      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 0
          format: table


      # ==================================================
      # 7. Build
      # EXACT Jenkins:
      # mvn package -DskipTests=true
      # ==================================================

      - name: Build
        run: |
          mvn package -DskipTests=true


      # ==================================================
      # 8. Docker Hub Login
      # Jenkins:
      # withDockerRegistry(credentialsId: 'docker-cred')
      # ==================================================

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      # ==================================================
      # 9. Docker Build
      # ==================================================

      - name: Docker Build
        run: |
          docker build \
            -t "${IMAGE_NAME}:${TAG}" \
            .


      # ==================================================
      # 10. Trivy Image Scan
      # exit-code 0 = don't stop pipeline
      # ==================================================

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${IMAGE_NAME}:${TAG}"
          severity: HIGH,CRITICAL
          exit-code: 0
          format: table


      # ==================================================
      # 11. Docker Push
      # EXACT Jenkins behavior
      # ==================================================

      - name: Docker Push Image
        run: |
          docker push "${IMAGE_NAME}:${TAG}"


      # ==================================================
      # 12. Setup kubectl
      # ==================================================

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest


      # ==================================================
      # 13. Configure Kubernetes
      #
      # Jenkins:
      # credentialsId: k8-token
      # serverUrl: <EKS API SERVER>
      #
      # GitHub:
      # K8S_TOKEN
      # K8S_API_SERVER
      # ==================================================

      - name: Configure Kubernetes
        run: |

          kubectl config set-cluster eks-cluster \
            --server="${K8S_API_SERVER}" \
            --insecure-skip-tls-verify=true

          kubectl config set-credentials k8-token \
            --token="${K8S_TOKEN}"

          kubectl config set-context eks-context \
            --cluster=eks-cluster \
            --user=k8-token \
            --namespace="${KUBE_NAMESPACE}"

          kubectl config use-context eks-context


      # ==================================================
      # 14. Test Kubernetes Connection
      #
      # IMPORTANT:
      # No kubectl cluster-info
      # No kubectl get nodes
      #
      # because Jenkins ServiceAccount is namespace scoped.
      # ==================================================

      - name: Test Kubernetes Connection
        run: |

          echo "Checking Kubernetes permissions..."

          kubectl auth can-i get pods \
            -n "${KUBE_NAMESPACE}"

          kubectl auth can-i get services \
            -n "${KUBE_NAMESPACE}"

          kubectl auth can-i get deployments \
            -n "${KUBE_NAMESPACE}"

          kubectl auth can-i patch services \
            -n "${KUBE_NAMESPACE}"

          echo "Checking existing resources..."

          kubectl get pods \
            -n "${KUBE_NAMESPACE}"

          kubectl get services \
            -n "${KUBE_NAMESPACE}"

          kubectl get deployments \
            -n "${KUBE_NAMESPACE}"


      # ==================================================
      # 15. Deploy MySQL
      # EXACT Jenkins FILE:
      # mysql-ds.yml
      # ==================================================

      - name: Deploy MySQL Deployment and Service
        run: |

          kubectl apply \
            -f mysql-ds.yml \
            -n "${KUBE_NAMESPACE}"


      # ==================================================
      # 16. Deploy Application Service
      # EXACT Jenkins FILE:
      # bankapp-service.yml
      #
      # EXACT Jenkins RESOURCE:
      # bankapp-service
      # ==================================================

      - name: Deploy SVC-APP
        run: |

          if ! kubectl get svc bankapp-service \
            -n "${KUBE_NAMESPACE}" > /dev/null 2>&1
          then

            kubectl apply \
              -f bankapp-service.yml \
              -n "${KUBE_NAMESPACE}"

          else

            echo "bankapp-service already exists"

          fi


      # ==================================================
      # 17. Select Blue / Green Deployment File
      #
      # EXACT Jenkins FILE NAMES
      # ==================================================

      - name: Select Deployment File
        run: |

          if [ "${DEPLOY_ENV}" = "blue" ]; then

            echo "DEPLOYMENT_FILE=app-deployment-blue.yml" \
              >> "$GITHUB_ENV"

          else

            echo "DEPLOYMENT_FILE=app-deployment-green.yml" \
              >> "$GITHUB_ENV"

          fi


      # ==================================================
      # 18. Deploy to Kubernetes
      #
      # EXACT Jenkins:
      # kubectl apply -f ${deploymentFile}
      #
      # NO rollout status here
      # ==================================================

      - name: Deploy to Kubernetes
        run: |

          echo "Deploying ${DEPLOY_ENV} environment"

          kubectl apply \
            -f "${DEPLOYMENT_FILE}" \
            -n "${KUBE_NAMESPACE}"


      # ==================================================
      # 19. Check Deployment Pods
      #
      # EXACT Jenkins verification concept
      # ==================================================

      - name: Check Deployment Pods
        run: |

          echo "Pods for ${DEPLOY_ENV}:"

          kubectl get pods \
            -l version="${DEPLOY_ENV}" \
            -n "${KUBE_NAMESPACE}"


      # ==================================================
      # 20. Switch Traffic
      #
      # EXACT Jenkins:
      # patch bankapp-service
      # app=bankapp
      # version=blue/green
      # ==================================================

      - name: Switch Traffic
        if: ${{ inputs.SWITCH_TRAFFIC == true }}
        run: |

          echo "Switching traffic to ${DEPLOY_ENV}"

          kubectl patch service bankapp-service \
            -n "${KUBE_NAMESPACE}" \
            -p "{\"spec\":{\"selector\":{\"app\":\"bankapp\",\"version\":\"${DEPLOY_ENV}\"}}}"

          echo "Traffic switched to ${DEPLOY_ENV}"


      # ==================================================
      # 21. Verify Deployment
      #
      # EXACT Jenkins:
      # get pods by version
      # get bankapp-service
      # ==================================================

      - name: Verify Deployment
        run: |

          echo "Checking Pods..."

          kubectl get pods \
            -l version="${DEPLOY_ENV}" \
            -n "${KUBE_NAMESPACE}"


          echo "Checking Service..."

          kubectl get svc \
            bankapp-service \
            -n "${KUBE_NAMESPACE}"


      # ==================================================
      # 22. Final Status
      # ==================================================

      - name: Deployment Successful
        run: |

          echo "======================================"
          echo "Deployment Successful"
          echo "Environment : ${DEPLOY_ENV}"
          echo "Docker Tag  : ${TAG}"
          echo "Image       : ${IMAGE_NAME}:${TAG}"
          echo "Namespace   : ${KUBE_NAMESPACE}"
          echo "======================================"
