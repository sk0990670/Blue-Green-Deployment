name: CI/CD - Blue Green Java

on:
  workflow_dispatch:
    inputs:

      DEPLOY_ENV:
        description: "Choose environment to deploy"
        required: true
        type: choice
        options:
          - blue
          - green

      DOCKER_TAG:
        description: "Choose Docker image tag"
        required: true
        type: choice
        options:
          - blue
          - green

      SWITCH_TRAFFIC:
        description: "Switch traffic between Blue and Green"
        required: true
        type: boolean
        default: false


env:
  IMAGE_NAME: solosahej/BlueGreenJava
  TAG: ${{ inputs.DOCKER_TAG }}

  KUBE_NAMESPACE: webapps

  DEPLOY_ENV: ${{ inputs.DEPLOY_ENV }}
  DEPLOYMENT: app-${{ inputs.DEPLOY_ENV }}

  K8S_API_SERVER: ${{ secrets.K8S_API_SERVER }}
  K8S_TOKEN: ${{ secrets.K8S_TOKEN }}


jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. Git Checkout
      # ==================================================

      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          ref: main


      # ==================================================
      # 2. Setup Java 17
      # ==================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven


      # ==================================================
      # 3. Setup Maven
      # ==================================================

      - name: Setup Maven
        run: |
          sudo apt-get update
          sudo apt-get install -y maven
          mvn -version


      # ==================================================
      # 4. Compile
      # Jenkins:
      # mvn compile
      # ==================================================

      - name: Compile
        run: |
          mvn -B compile


      # ==================================================
      # 5. Tests
      # Same behavior as Jenkins project:
      # mvn test -DskipTests=true
      #
      # Tests stage is kept, but actual test execution
      # is skipped so pipeline does not fail on existing
      # test problems.
      # ==================================================

      - name: Tests
        run: |
          mvn -B test -DskipTests=true


      # ==================================================
      # 6. Trivy Filesystem Scan
      #
      # exit-code: 0
      # Vulnerabilities are displayed but pipeline
      # continues.
      # ==================================================

      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 0
          format: table


      # ==================================================
      # 7. Build Java Application
      # No Nexus
      # ==================================================

      - name: Build
        run: |
          mvn -B package -DskipTests=true


      # ==================================================
      # 8. Login to Docker Hub
      # ==================================================

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      # ==================================================
      # 9. Docker Build
      # ==================================================

      - name: Docker Build
        run: |
          docker build \
            -t "${IMAGE_NAME}:${TAG}" \
            .


      # ==================================================
      # 10. Trivy Image Scan
      #
      # exit-code: 0
      # ==================================================

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ env.TAG }}"
          severity: HIGH,CRITICAL
          exit-code: 0
          format: table


      # ==================================================
      # 11. Docker Push
      # ==================================================

      - name: Docker Push Image
        run: |
          docker push "${IMAGE_NAME}:${TAG}"


      # ==================================================
      # 12. Setup kubectl
      # ==================================================

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest


      # ==================================================
      # 13. Configure Kubernetes
      #
      # Same Jenkins concept:
      # Server URL + K8S Token
      # ==================================================

      - name: Configure Kubernetes
        run: |

          kubectl config set-cluster eks-cluster \
            --server="${K8S_API_SERVER}" \
            --insecure-skip-tls-verify=true

          kubectl config set-credentials k8-token \
            --token="${K8S_TOKEN}"

          kubectl config set-context eks-context \
            --cluster=eks-cluster \
            --user=k8-token \
            --namespace="${KUBE_NAMESPACE}"

          kubectl config use-context eks-context


      # ==================================================
      # 14. Test Kubernetes Connection
      #
      # DO NOT use:
      # kubectl cluster-info
      # kubectl get nodes
      #
      # because the jenkins ServiceAccount is scoped
      # to the webapps namespace.
      # ==================================================

      - name: Test Kubernetes Connection
        run: |

          echo "Testing Kubernetes permissions..."

          kubectl auth can-i get pods \
            -n "${KUBE_NAMESPACE}"

          kubectl auth can-i get services \
            -n "${KUBE_NAMESPACE}"

          kubectl auth can-i get deployments \
            -n "${KUBE_NAMESPACE}"

          kubectl auth can-i create deployments \
            -n "${KUBE_NAMESPACE}"

          kubectl auth can-i patch services \
            -n "${KUBE_NAMESPACE}"

          kubectl auth can-i get pods/log \
            -n "${KUBE_NAMESPACE}"

          echo "Kubernetes access test..."

          kubectl get pods \
            -n "${KUBE_NAMESPACE}"

          kubectl get services \
            -n "${KUBE_NAMESPACE}"

          kubectl get deployments \
            -n "${KUBE_NAMESPACE}"


      # ==================================================
      # 15. Deploy MySQL
      #
      # EXACT SAME FILE AS JENKINS
      # ==================================================

      - name: Deploy MySQL Deployment and Service
        run: |

          kubectl apply \
            -f mysql-ds.yml \
            -n "${KUBE_NAMESPACE}"


      # ==================================================
      # 16. Deploy Application Service
      #
      # EXACT SAME FILE AS JENKINS
      # ==================================================

      - name: Deploy SVC-APP
        run: |

          if ! kubectl get svc bankapp-service \
            -n "${KUBE_NAMESPACE}" > /dev/null 2>&1
          then

            kubectl apply \
              -f bankapp-service.yml \
              -n "${KUBE_NAMESPACE}"

          else

            echo "bankapp-service already exists"

          fi


      # ==================================================
      # 17. Select Blue / Green Deployment File
      #
      # EXACT SAME FILES
      # ==================================================

      - name: Select Deployment File
        run: |

          if [ "${DEPLOY_ENV}" = "blue" ]; then

            echo "DEPLOYMENT_FILE=app-deployment-blue.yml" \
              >> "$GITHUB_ENV"

          else

            echo "DEPLOYMENT_FILE=app-deployment-green.yml" \
              >> "$GITHUB_ENV"

          fi


      # ==================================================
      # 18. Deploy Blue / Green
      # ==================================================

      - name: Deploy to Kubernetes
        run: |

          kubectl apply \
            -f "${DEPLOYMENT_FILE}" \
            -n "${KUBE_NAMESPACE}"


      # ==================================================
      # 19. Wait for Deployment
      # ==================================================

      - name: Wait for Deployment
        run: |

          kubectl rollout status \
            deployment/"${DEPLOYMENT}" \
            -n "${KUBE_NAMESPACE}" \
            --timeout=120s


      # ==================================================
      # 20. Check Deployment Pods
      # ==================================================

      - name: Check Deployment Pods
        run: |

          kubectl get pods \
            -l version="${DEPLOY_ENV}" \
            -n "${KUBE_NAMESPACE}"


      # ==================================================
      # 21. Verify Pods Are Ready
      # ==================================================

      - name: Verify Pods Are Ready
        run: |

          kubectl wait \
            --for=condition=ready \
            pod \
            -l version="${DEPLOY_ENV}" \
            -n "${KUBE_NAMESPACE}" \
            --timeout=120s


      # ==================================================
      # 22. Switch Traffic
      # ==================================================

      - name: Switch Traffic
        if: ${{ inputs.SWITCH_TRAFFIC == true }}
        run: |

          echo "Switching traffic to ${DEPLOY_ENV}"

          kubectl patch service bankapp-service \
            -n "${KUBE_NAMESPACE}" \
            -p "{\"spec\":{\"selector\":{\"app\":\"bankapp\",\"version\":\"${DEPLOY_ENV}\"}}}"

          echo "Traffic switched to ${DEPLOY_ENV}"


      # ==================================================
      # 23. Verify Deployment
      # ==================================================

      - name: Verify Deployment
        run: |

          echo "Checking Pods..."

          kubectl get pods \
            -l version="${DEPLOY_ENV}" \
            -n "${KUBE_NAMESPACE}"

          echo "Checking Service..."

          kubectl get svc \
            bankapp-service \
            -n "${KUBE_NAMESPACE}"

          echo "Checking Deployment..."

          kubectl get deployment \
            "${DEPLOYMENT}" \
            -n "${KUBE_NAMESPACE}"

          echo "Checking Service Endpoints..."

          kubectl get endpoints \
            bankapp-service \
            -n "${KUBE_NAMESPACE}"


      # ==================================================
      # 24. Final Status
      # ==================================================

      - name: Deployment Successful
        run: |

          echo "======================================"
          echo "Deployment Successful"
          echo "Environment : ${DEPLOY_ENV}"
          echo "Docker Tag  : ${TAG}"
          echo "Deployment  : ${DEPLOYMENT}"
          echo "Namespace   : ${KUBE_NAMESPACE}"
          echo "======================================"
