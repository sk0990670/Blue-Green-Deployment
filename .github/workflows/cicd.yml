name: CI/CD - Blue Green Java

on:
  workflow_dispatch:
    inputs:

      DEPLOY_ENV:
        description: "Choose environment to deploy"
        required: true
        type: choice
        options:
          - blue
          - green

      DOCKER_TAG:
        description: "Choose Docker image tag"
        required: true
        type: choice
        options:
          - blue
          - green

      SWITCH_TRAFFIC:
        description: "Switch traffic between Blue and Green"
        required: true
        type: boolean
        default: false


# ==========================================================
# GLOBAL VARIABLES
# ==========================================================

env:
  IMAGE_NAME: solosahej/bluegreenjava

  TAG: ${{ inputs.DOCKER_TAG }}

  KUBE_NAMESPACE: webapps

  DEPLOY_ENV: ${{ inputs.DEPLOY_ENV }}

  # Kept for Jenkins-style compatibility.
  # We do NOT assume this is the actual Kubernetes
  # Deployment name during runtime.
  DEPLOYMENT: app-${{ inputs.DEPLOY_ENV }}

  K8S_API_SERVER: ${{ secrets.K8S_API_SERVER }}
  K8S_TOKEN: ${{ secrets.K8S_TOKEN }}


jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. Git Checkout
      # ==================================================

      - name: Git Checkout
        uses: actions/checkout@v5
        with:
          ref: main


      # ==================================================
      # 2. Setup Java 17
      # Stable production release of setup-java
      # ==================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven


      # ==================================================
      # 3. Check Java and Maven
      # ==================================================

      - name: Check Java and Maven
        run: |
          java -version
          mvn -version


      # ==================================================
      # 4. Compile
      #
      # EXACT Jenkins:
      # mvn compile
      # ==================================================

      - name: Compile
        run: |
          mvn -B compile


      # ==================================================
      # 5. Tests
      #
      # EXACT Jenkins behavior:
      # mvn test -DskipTests=true
      #
      # This keeps the Tests stage but skips actual
      # test execution, matching the working Jenkins job.
      # ==================================================

      - name: Tests
        run: |
          mvn -B test -DskipTests=true


      # ==================================================
      # 6. Trivy Filesystem Scan
      #
      # exit-code = 0
      # HIGH/CRITICAL findings are shown but do not
      # stop this pipeline.
      # ==================================================

      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table


      # ==================================================
      # 7. Build Java Application
      #
      # Nexus removed.
      # ==================================================

      - name: Build
        run: |
          mvn -B package -DskipTests=true


      # ==================================================
      # 8. Docker Hub Login
      # ==================================================

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      # ==================================================
      # 9. Docker Build
      # ==================================================

      - name: Docker Build
        run: |
          echo "Building image:"
          echo "${IMAGE_NAME}:${TAG}"

          docker build \
            -t "${IMAGE_NAME}:${TAG}" \
            .


      # ==================================================
      # 10. Verify Docker Image Exists
      # ==================================================

      - name: Verify Docker Image
        run: |
          docker image inspect "${IMAGE_NAME}:${TAG}" > /dev/null

          echo "Docker image created:"
          echo "${IMAGE_NAME}:${TAG}"


      # ==================================================
      # 11. Trivy Image Scan
      #
      # IMPORTANT:
      #
      # Correct GitHub expression syntax:
      # ${{ env.IMAGE_NAME }}:${{ env.TAG }}
      #
      # NOT:
      # ${IMAGE_NAME}:${TAG}
      # ==================================================

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ env.TAG }}"
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table


      # ==================================================
      # 12. Push Docker Image
      # ==================================================

      - name: Docker Push Image
        run: |
          docker push "${IMAGE_NAME}:${TAG}"


      # ==================================================
      # 13. Setup kubectl
      # ==================================================

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5.1.0
        with:
          version: latest


      # ==================================================
      # 14. Configure Kubernetes
      #
      # Jenkins equivalent:
      #
      # credentialsId = k8-token
      # serverUrl     = EKS API server
      # namespace     = webapps
      # ==================================================

      - name: Configure Kubernetes
        run: |

          kubectl config set-cluster eks-cluster \
            --server="${K8S_API_SERVER}" \
            --insecure-skip-tls-verify=true

          kubectl config set-credentials k8-token \
            --token="${K8S_TOKEN}"

          kubectl config set-context eks-context \
            --cluster=eks-cluster \
            --user=k8-token \
            --namespace="${KUBE_NAMESPACE}"

          kubectl config use-context eks-context


      # ==================================================
      # 15. Test Kubernetes RBAC
      #
      # Namespace scoped:
      # webapps
      # ==================================================

      - name: Test Kubernetes Connection
        run: |

          echo "Checking Kubernetes permissions..."

          test "$(kubectl auth can-i get pods -n "${KUBE_NAMESPACE}")" = "yes"

          test "$(kubectl auth can-i get pods/log -n "${KUBE_NAMESPACE}")" = "yes"

          test "$(kubectl auth can-i get services -n "${KUBE_NAMESPACE}")" = "yes"

          test "$(kubectl auth can-i get deployments -n "${KUBE_NAMESPACE}")" = "yes"

          test "$(kubectl auth can-i create deployments -n "${KUBE_NAMESPACE}")" = "yes"

          test "$(kubectl auth can-i patch services -n "${KUBE_NAMESPACE}")" = "yes"

          echo "All required Kubernetes permissions are available."


      # ==================================================
      # 16. Show Current Resources
      # ==================================================

      - name: Show Kubernetes Resources
        run: |

          echo "Pods:"
          kubectl get pods -n "${KUBE_NAMESPACE}" || true

          echo "Services:"
          kubectl get services -n "${KUBE_NAMESPACE}" || true

          echo "Deployments:"
          kubectl get deployments -n "${KUBE_NAMESPACE}" || true


      # ==================================================
      # 17. Deploy MySQL
      #
      # EXACT FILE FROM JENKINS:
      # mysql-ds.yml
      # ==================================================

      - name: Deploy MySQL
        run: |

          kubectl apply \
            -f mysql-ds.yml \
            -n "${KUBE_NAMESPACE}"


      # ==================================================
      # 18. Ensure MySQL Service Exists
      #
      # This specifically prevents the error you previously
      # saw:
      #
      # services "mysql" not found
      # ==================================================

      - name: Ensure MySQL Service
        run: |

          if kubectl get svc mysql \
            -n "${KUBE_NAMESPACE}" > /dev/null 2>&1
          then

            echo "mysql service already exists."

          else

            echo "mysql service not found."
            echo "Creating mysql service from mysql deployment..."

            kubectl expose deployment mysql \
              --name=mysql \
              --port=3306 \
              --target-port=3306 \
              --type=ClusterIP \
              -n "${KUBE_NAMESPACE}"

          fi

          echo "MySQL Service:"
          kubectl get svc mysql \
            -n "${KUBE_NAMESPACE}"


      # ==================================================
      # 19. Wait for MySQL Pod
      # ==================================================

      - name: Wait for MySQL Pod
        run: |

          echo "Waiting for MySQL pod..."

          kubectl wait \
            --for=condition=ready \
            pod \
            -l app=mysql \
            -n "${KUBE_NAMESPACE}" \
            --timeout=180s


      # ==================================================
      # 20. Wait for MySQL Service Endpoint
      # ==================================================

      - name: Verify MySQL Ready
        run: |

          echo "Waiting for MySQL endpoint..."

          for i in {1..30}
          do

            MYSQL_ENDPOINTS=$(
              kubectl get endpoints mysql \
                -n "${KUBE_NAMESPACE}" \
                -o jsonpath='{.subsets[*].addresses[*].ip}' \
                2>/dev/null || true
            )

            if [ -n "${MYSQL_ENDPOINTS}" ]
            then

              echo "MySQL endpoint is ready:"
              echo "${MYSQL_ENDPOINTS}"

              exit 0

            fi

            echo "MySQL endpoint not ready..."
            echo "Attempt ${i}/30"

            sleep 5

          done

          echo "ERROR: MySQL did not become ready."

          kubectl get pods \
            -n "${KUBE_NAMESPACE}" \
            -o wide || true

          kubectl get svc mysql \
            -n "${KUBE_NAMESPACE}" || true

          kubectl get endpoints mysql \
            -n "${KUBE_NAMESPACE}" || true

          exit 1


      # ==================================================
      # 21. Deploy Application Service
      #
      # EXACT FILE FROM JENKINS:
      # bankapp-service.yml
      # ==================================================

      - name: Deploy SVC-APP
        run: |

          if kubectl get svc bankapp-service \
            -n "${KUBE_NAMESPACE}" > /dev/null 2>&1
          then

            echo "bankapp-service already exists."

          else

            echo "Creating bankapp-service..."

            kubectl apply \
              -f bankapp-service.yml \
              -n "${KUBE_NAMESPACE}"

          fi


      # ==================================================
      # 22. Select Blue / Green Deployment File
      #
      # EXACT Jenkins file names:
      #
      # blue  -> app-deployment-blue.yml
      # green -> app-deployment-green.yml
      # ==================================================

      - name: Select Deployment File
        run: |

          if [ "${DEPLOY_ENV}" = "blue" ]
          then

            echo "DEPLOYMENT_FILE=app-deployment-blue.yml" \
              >> "${GITHUB_ENV}"

          else

            echo "DEPLOYMENT_FILE=app-deployment-green.yml" \
              >> "${GITHUB_ENV}"

          fi

          echo "Selected: ${DEPLOY_ENV}"


      # ==================================================
      # 23. Deploy Blue / Green
      #
      # EXACT Jenkins:
      # kubectl apply -f ${deploymentFile}
      # ==================================================

      - name: Deploy to Kubernetes
        run: |

          echo "Deploying ${DEPLOY_ENV}..."

          kubectl apply \
            -f "${DEPLOYMENT_FILE}" \
            -n "${KUBE_NAMESPACE}"


      # ==================================================
      # 24. Show Blue / Green Pods
      # ==================================================

      - name: Check Deployment Pods
        run: |

          echo "Pods for ${DEPLOY_ENV}:"

          kubectl get pods \
            -l version="${DEPLOY_ENV}" \
            -n "${KUBE_NAMESPACE}" \
            -o wide


      # ==================================================
      # 25. Detect Actual Deployment
      #
      # We don't blindly assume:
      # app-blue / app-green
      #
      # We derive the deployment from:
      # Pod -> ReplicaSet -> Deployment
      # ==================================================

      - name: Detect Deployment
        run: |

          echo "Detecting actual deployment..."

          POD_NAME=$(
            kubectl get pods \
              -n "${KUBE_NAMESPACE}" \
              -l version="${DEPLOY_ENV}" \
              -o jsonpath='{.items[0].metadata.name}'
          )

          if [ -z "${POD_NAME}" ]
          then

            echo "ERROR: No pod found for version=${DEPLOY_ENV}"

            kubectl get pods \
              -n "${KUBE_NAMESPACE}" \
              --show-labels

            exit 1

          fi

          echo "Pod: ${POD_NAME}"


          REPLICA_SET=$(
            kubectl get pod "${POD_NAME}" \
              -n "${KUBE_NAMESPACE}" \
              -o jsonpath='{.metadata.ownerReferences[0].name}'
          )

          if [ -z "${REPLICA_SET}" ]
          then

            echo "ERROR: ReplicaSet could not be detected."

            exit 1

          fi

          echo "ReplicaSet: ${REPLICA_SET}"


          DEPLOYMENT_NAME=$(
            kubectl get rs "${REPLICA_SET}" \
              -n "${KUBE_NAMESPACE}" \
              -o jsonpath='{.metadata.ownerReferences[0].name}'
          )

          if [ -z "${DEPLOYMENT_NAME}" ]
          then

            echo "ERROR: Deployment could not be detected."

            exit 1

          fi

          echo "Deployment: ${DEPLOYMENT_NAME}"

          echo "DEPLOYMENT_NAME=${DEPLOYMENT_NAME}" \
            >> "${GITHUB_ENV}"


      # ==================================================
      # 26. Wait for Actual Deployment
      # ==================================================

      - name: Wait for Deployment
        run: |

          echo "Waiting for:"
          echo "${DEPLOYMENT_NAME}"

          kubectl rollout status \
            deployment/"${DEPLOYMENT_NAME}" \
            -n "${KUBE_NAMESPACE}" \
            --timeout=180s


      # ==================================================
      # 27. Verify Pods Are Ready
      #
      # Traffic should never move to an unhealthy
      # Blue/Green environment.
      # ==================================================

      - name: Verify Pods Are Ready
        run: |

          kubectl wait \
            --for=condition=ready \
            pod \
            -l version="${DEPLOY_ENV}" \
            -n "${KUBE_NAMESPACE}" \
            --timeout=180s


      # ==================================================
      # 28. Switch Traffic
      #
      # EXACT Jenkins:
      # bankapp-service
      # app=bankapp
      # version=blue/green
      # ==================================================

      - name: Switch Traffic
        if: ${{ inputs.SWITCH_TRAFFIC == true }}
        run: |

          echo "Switching traffic to ${DEPLOY_ENV}..."

          kubectl patch service bankapp-service \
            -n "${KUBE_NAMESPACE}" \
            -p "{\"spec\":{\"selector\":{\"app\":\"bankapp\",\"version\":\"${DEPLOY_ENV}\"}}}"

          echo "Traffic successfully switched to ${DEPLOY_ENV}."


      # ==================================================
      # 29. Final Verification
      # ==================================================

      - name: Verify Deployment
        run: |

          echo "======================================"
          echo "Pods"
          echo "======================================"

          kubectl get pods \
            -l version="${DEPLOY_ENV}" \
            -n "${KUBE_NAMESPACE}"


          echo "======================================"
          echo "Service"
          echo "======================================"

          kubectl get svc \
            bankapp-service \
            -n "${KUBE_NAMESPACE}"


          echo "======================================"
          echo "Endpoints"
          echo "======================================"

          kubectl get endpoints \
            bankapp-service \
            -n "${KUBE_NAMESPACE}"


          echo "======================================"
          echo "Deployment"
          echo "======================================"

          kubectl get deployment \
            "${DEPLOYMENT_NAME}" \
            -n "${KUBE_NAMESPACE}"


      # ==================================================
      # 30. Diagnostics on Failure
      #
      # This is particularly useful for:
      # ImagePullBackOff
      # CrashLoopBackOff
      # ==================================================

      - name: Kubernetes Diagnostics
        if: ${{ failure() }}
        run: |

          echo "======================================"
          echo "PODS"
          echo "======================================"

          kubectl get pods \
            -n "${KUBE_NAMESPACE}" \
            -o wide || true


          echo "======================================"
          echo "SERVICES"
          echo "======================================"

          kubectl get svc \
            -n "${KUBE_NAMESPACE}" || true


          echo "======================================"
          echo "DEPLOYMENTS"
          echo "======================================"

          kubectl get deployments \
            -n "${KUBE_NAMESPACE}" || true


          echo "======================================"
          echo "ENDPOINTS"
          echo "======================================"

          kubectl get endpoints \
            -n "${KUBE_NAMESPACE}" || true


          echo "======================================"
          echo "EVENTS"
          echo "======================================"

          kubectl get events \
            -n "${KUBE_NAMESPACE}" \
            --sort-by=.lastTimestamp || true


          echo "======================================"
          echo "POD DESCRIPTIONS"
          echo "======================================"

          kubectl describe pods \
            -n "${KUBE_NAMESPACE}" \
            -l version="${DEPLOY_ENV}" || true


          echo "======================================"
          echo "POD LOGS"
          echo "======================================"

          for POD in $(kubectl get pods \
            -n "${KUBE_NAMESPACE}" \
            -l version="${DEPLOY_ENV}" \
            -o jsonpath='{.items[*].metadata.name}' 2>/dev/null)
          do

            echo "---------- ${POD} ----------"

            kubectl logs "${POD}" \
              -n "${KUBE_NAMESPACE}" \
              --all-containers=true \
              --tail=100 || true

          done


      # ==================================================
      # 31. Final Status
      # ==================================================

      - name: Deployment Successful
        run: |

          echo "======================================"
          echo "      DEPLOYMENT SUCCESSFUL"
          echo "======================================"
          echo "Environment : ${DEPLOY_ENV}"
          echo "Docker Tag  : ${TAG}"
          echo "Image       : ${IMAGE_NAME}:${TAG}"
          echo "Deployment  : ${DEPLOYMENT_NAME}"
          echo "Namespace   : ${KUBE_NAMESPACE}"
          echo "======================================"
